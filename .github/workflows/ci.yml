name: CI

on:
  pull_request:
    branches: [master]
  workflow_call: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cache Astro build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.astro
          key: astro-${{ runner.os }}-${{ hashFiles('package-lock.json', 'src/content/**') }}
          restore-keys: |
            astro-${{ runner.os }}-
      - name: Format check
        run: npm run format:check
      - name: Media check
        run: npm run check:media
      - name: Type check
        run: npm run check
      - name: Build
        run: npm run build:only
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: End-to-end tests (chromium, mobile-chrome)
        run: npx playwright test --project=chromium --project=mobile-chrome
      - name: End-to-end tests (webkit)
        # Run alone, one worker: sharing the runner's CPU with chromium/mobile-chrome workers
        # starves WebKit's real-time animation code enough to blow past its own completion
        # windows (reveal/typing/decrypt timing assertions) — not a test bug, a contention one.
        run: npx playwright test --project=webkit --workers=1
      - name: Lighthouse CI
        if: github.event_name == 'pull_request'
        run: npm run test:lhci
      - name: Upload site build
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouseci
          path: .lighthouseci
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
